<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>咨询室 · Case 001A</title>
<style>
  :root{
    --primary:#4D6BFE;--primary-dark:#3B55D9;--primary-bg:#EEF1FE;
    --success:#059669;--success-bg:#ECFDF5;
    --warning:#B45309;--warning-bg:#FFFBEB;
    --danger:#DC2626;--danger-bg:#FEF2F2;
    --text:#1F2937;--text-secondary:#6B7280;--text-muted:#9CA3AF;
    --bg:#F5F7FB;--card:#FFFFFF;--border-light:#E5E9F2;--border:#D8DEEB;
    --bubble-user:#4D6BFE;--bubble-user-bg:#EEF1FE;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg);color:var(--text);padding:24px 18px 70px;line-height:1.7}
  .container{max-width:880px;margin:0 auto}
  .brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;font-size:13px;color:var(--text-muted);font-weight:500}
  .brand .back-link{margin-left:auto;color:var(--primary);text-decoration:none;font-weight:600;font-size:12.5px;padding:6px 12px;border:1px solid rgba(77,107,254,.3);border-radius:999px;transition:all .2s;white-space:nowrap}
  .brand .back-link:hover{background:var(--primary-bg);border-color:var(--primary)}
  .brand-dot{width:8px;height:8px;border-radius:50%;background:var(--primary)}
  .brand-name{font-weight:700;color:var(--text)}

  .progress-bar{height:4px;background:var(--border-light);border-radius:999px;margin-bottom:20px;overflow:hidden}
  .progress-fill{height:100%;background:linear-gradient(90deg,#4D6BFE,#6366F1);border-radius:999px;transition:width .4s ease}

  .hero{background:linear-gradient(135deg,#4D6BFE,#6366F1);border-radius:16px;padding:30px 26px;color:#fff;margin-bottom:22px}
  .hero .case-tag{display:inline-block;font-size:11px;font-weight:700;background:rgba(255,255,255,.18);padding:4px 12px;border-radius:999px;margin-bottom:10px}
  .hero h1{font-size:22px;margin-bottom:8px;line-height:1.4}
  .hero .subtitle{font-size:13.5px;opacity:.92}

  .stage-card{background:var(--card);border:1.5px solid var(--border-light);border-radius:14px;padding:26px 24px;margin-bottom:18px;box-shadow:0 1px 3px rgba(31,41,55,.04)}
  .stage-label{font-size:11px;font-weight:700;color:var(--primary);letter-spacing:2px;margin-bottom:10px}
  .stage-title{font-size:17px;font-weight:700;margin-bottom:6px}
  .stage-subtitle{font-size:13.5px;color:var(--text-secondary);margin-bottom:18px}

  .question-box{background:var(--primary-bg);border-left:3px solid var(--primary);padding:16px 18px;border-radius:0 10px 10px 0;font-size:14.5px;line-height:1.9;margin-bottom:14px}
  .hint-card{background:var(--warning-bg);border:1px solid rgba(180,83,9,.2);border-radius:10px;padding:14px 16px;font-size:13px;color:var(--warning);margin-top:14px}

  .round-meta{display:flex;align-items:center;justify-content:space-between;font-size:12.5px;color:var(--text-muted);margin-bottom:14px}
  .round-meta .round-idx{font-weight:700;color:var(--primary)}
  .ask-budget{display:inline-flex;gap:4px}
  .ask-budget .pip{width:8px;height:8px;border-radius:50%;background:var(--border)}
  .ask-budget .pip.used{background:var(--primary)}

  .q-pair{display:flex;flex-direction:column;gap:12px}
  .q-card{position:relative;padding:18px 20px;background:var(--card);border:1.5px solid var(--border-light);border-radius:12px;cursor:pointer;transition:all .18s}
  .q-card:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(77,107,254,.12)}
  .q-card .q-tag{font-size:11px;color:var(--text-muted);margin-bottom:6px;font-weight:600}
  .q-card .q-text{font-size:14.5px;font-weight:500}
  .q-card.picked{border-color:var(--primary);background:var(--primary-bg);cursor:default}
  .q-card.picked .q-text{color:var(--primary-dark)}
  .q-card.missed{border-color:var(--border);background:var(--bg);cursor:default;opacity:.65}
  .q-card.missed .q-text{text-decoration:line-through;text-decoration-color:var(--text-muted)}

  .dialog{display:flex;flex-direction:column;gap:10px;margin-top:16px}
  .bubble{max-width:88%;padding:12px 16px;border-radius:14px;font-size:13.5px;line-height:1.8}
  .bubble.me{align-self:flex-end;background:var(--bubble-user);color:#fff;border-bottom-right-radius:4px}
  .bubble.them{align-self:flex-start;background:var(--bg);border:1px solid var(--border-light);border-bottom-left-radius:4px;color:var(--text)}
  .bubble.them .who{font-size:11px;color:var(--text-muted);margin-bottom:4px;font-weight:600}

  .info-panel{background:var(--bg);border:1px solid var(--border-light);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .info-panel .ip-title{font-size:12px;font-weight:700;color:var(--text-muted);letter-spacing:1px;margin-bottom:12px}
  .info-row{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px dashed var(--border-light);font-size:13.5px}
  .info-row:last-child{border-bottom:none}
  .info-row .dot{flex:none;width:7px;height:7px;border-radius:50%;margin-top:8px}
  .info-row.got .dot{background:var(--success)}
  .info-row.got .txt{color:var(--text)}
  .info-row.miss .dot{background:var(--border)}
  .info-row.miss .txt{color:var(--text-muted);font-style:italic}

  .adv-card{padding:18px 20px;background:var(--card);border:1.5px solid var(--border-light);border-radius:12px;margin-bottom:10px;cursor:pointer;transition:all .18s}
  .adv-card:hover{border-color:var(--primary);box-shadow:0 4px 14px rgba(77,107,254,.12)}
  .adv-card .adv-text{font-size:14.5px;font-weight:500}
  .adv-card.picked{border-color:var(--primary);background:var(--primary-bg);cursor:default}
  .adv-card.dimmed{opacity:.5;cursor:default}
  .adv-card .adv-reaction{margin-top:12px}

  .feedback{padding:14px 18px;border-radius:10px;font-size:13.5px;margin-top:14px;line-height:1.8}
  .feedback-good{background:var(--success-bg);border:1px solid rgba(5,150,105,.25);color:var(--success)}
  .feedback-warn{background:var(--warning-bg);border:1px solid rgba(180,83,9,.25);color:var(--warning)}
  .feedback-bad{background:var(--danger-bg);border:1px solid rgba(220,38,38,.25);color:var(--danger)}
  .feedback-info{background:var(--primary-bg);border:1px solid rgba(77,107,254,.25);color:var(--primary-dark)}

  .tap-hint{position:sticky;top:8px;z-index:20;margin:14px 0 18px;padding:11px 16px;text-align:center;
    background:rgba(248,250,252,.92);border:1.5px dashed rgba(77,107,254,.45);border-radius:12px;
    font-size:13.5px;font-weight:600;color:var(--primary);
    cursor:pointer;user-select:none;animation:tapPulse 2s ease-in-out infinite;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
  @keyframes tapPulse{0%,100%{border-color:rgba(77,107,254,.45);box-shadow:0 0 0 0 rgba(77,107,254,.18)}
    50%{border-color:rgba(77,107,254,.85);box-shadow:0 0 0 7px rgba(77,107,254,0)}}
  .tap-hint.done{animation:none;border-style:solid;border-color:rgba(5,150,105,.4);background:rgba(5,150,105,.08);color:var(--success);cursor:default}

  .step{padding:16px 20px;background:var(--bg);border:1px solid var(--border-light);border-radius:10px;margin-bottom:10px;opacity:0;transform:translateY(8px);transition:all .4s}
  .step.show{opacity:1;transform:translateY(0)}
  .step .step-title{font-size:14.5px;font-weight:700;color:var(--primary-dark);margin-bottom:6px}
  .step .step-body{font-size:13.5px;color:var(--text-secondary);line-height:1.8}

  .quote-card{padding:16px 20px;background:var(--bg);border:1px solid var(--border-light);border-radius:10px;margin-bottom:10px}
  .quote-text{font-size:15px;font-weight:500;color:var(--text);line-height:1.75;font-style:italic}

  .report-box{background:var(--card);border:1.5px solid var(--border-light);border-radius:12px;padding:20px;margin-top:18px}
  .report-content{font-size:13px;color:var(--text);line-height:1.85;white-space:pre-wrap;font-family:'SF Mono','Cascadia Code','Consolas',monospace;background:var(--bg);padding:14px;border-radius:8px;max-height:240px;overflow-y:auto}
  .copy-ok{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;background:var(--success-bg);color:var(--success);border-radius:8px;font-size:12px;font-weight:600;margin-top:8px;border:1px solid rgba(5,150,105,.3);opacity:0;transition:opacity .3s}
  .copy-ok.show{opacity:1}

  .funnel-card{background:linear-gradient(135deg,rgba(77,107,254,.07),rgba(99,102,241,.07));border:1.5px solid rgba(77,107,254,.25);border-radius:14px;padding:24px;text-align:center;margin-top:18px}
  .funnel-title{font-size:16px;font-weight:700;color:var(--primary-dark);margin-bottom:6px}
  .funnel-subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:16px;line-height:1.8}
  .funnel-qr{display:inline-block;background:#fff;padding:12px;border-radius:12px}
  .funnel-qr img{width:160px;height:160px;display:block;image-rendering:pixelated}
  .funnel-tag{font-size:12px;color:var(--text-muted);margin-top:10px}

  .btn-row{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:8px}
  .btn{padding:11px 24px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;transition:all .18s;font-family:inherit}
  .btn-primary{background:var(--primary);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--primary-dark);transform:translateY(-1px)}
  .btn-primary:disabled{background:var(--border);cursor:not-allowed}
  .btn-ghost{background:transparent;color:var(--text-secondary);border:1.5px solid var(--border)}
  .btn-ghost:hover{border-color:var(--primary);color:var(--primary)}

  @media (max-width:600px){
    body{padding:16px 12px 60px}
    .hero{padding:24px 20px;border-radius:14px}
    .hero h1{font-size:20px}
    .stage-card{padding:22px 18px;border-radius:12px}
    .bubble{max-width:94%}
    .funnel-qr img{width:140px;height:140px}
  }
</style>
</head>
<body>
<div class="container">
  <div class="brand">
    <span class="brand-dot"></span>
    <span class="brand-name">咨询室</span>
    <span>· 「漫道」群 职场问答系列</span>
    <a class="back-link" href="index.html">咨询室主页 →</a>
  </div>

  <div class="progress-bar" id="progress-bar" style="display:none">
    <div class="progress-fill" id="progress-fill" style="width:0%"></div>
  </div>

  <div id="case-header"></div>
  <div id="stage-container"></div>
  <div id="action-row" class="btn-row"></div>
</div>

<script>
/* ============================================================
   配置：优先 fetch 同目录 JSON；file:// 直开时用内嵌兜底
   ============================================================ */
const FALLBACK_CONFIG = {
  "case_id": "case-001a",
  "mode": "consult",
  "title": "咨询室 · Case 001A",
  "subtitle": "三十岁，存款三万，想找一个副业",
  "background": {
    "scene_label": "匿名提问 · 来自群内小会",
    "question_text": "我的情况：男，30，未婚单身，新疆小城市，街道事业编科员，普通二本文科，没驾照，电脑小白。不烟不酒不氪金，但爱吃，从 100 公斤减到现在 93 公斤。性格宅，没结婚意愿，母亲不催婚。\n\n从小父母离异，和父亲关系差。母亲近两年才交社保，未来的养老只有靠我。我工作后自愿给她补贴了十几万，现在手里存款三万。\n\n工作清闲稳定饿不死，不忙时每天一小时干完活。\n\n考过了助理社工师，每月 300 补贴；在备考中级，另外因法考有一万奖励，想考但畏难。\n\n想找一个非体力、能长期干、不太需要前置财力投入的副业，目标一个月六千。",
    "hint_card": "接下来由你向他提问，从回答里找线索。"
  },
  "questions": {
    "rounds": 6,
    "pool": [
      {
        "id": "q_debt",
        "text": "你现在手上有多少存款？一年能存下多少？",
        "answer": "我 18 年底参加工作，每年收入 7 万左右，去掉一个人在异地的生活成本和替我妈还的钱，身上存款就 3 万多，还得留着应急。替我妈还的账，就是按我的现有存款大致估出来的。",
        "critical": true,
        "info": "现金流已绷到极限，没有任何试错本钱"
      },
      {
        "id": "q_tried",
        "text": "这几年为副业做过什么尝试？哪怕失败的也算。",
        "answer": "社工师证考了个初级，一个月 300 补贴；法考有想法，但身边失败例子太多，畏难，没任何实际行动。副业嘛……说实话什么都没试过。起号那种，我老觉得在空中飘着。",
        "critical": true,
        "info": "卡点不在选哪条路，在从未启动——对互联网认知几乎为零"
      },
      {
        "id": "q_body",
        "text": "身体现在什么状态？平时运动吗？",
        "answer": "93 公斤，从 100 减下来的，主要靠控制饮食，基本不运动。我对自己外形倒是没那么自卑，早就和自己的外形条件和解了，但对不熟悉的领域确实有点不自信。",
        "critical": true,
        "info": "和解两个字是雷——93 公斤依然肥胖，用节食硬扛，运动习惯为零"
      },
      {
        "id": "q_why",
        "text": "为什么是现在急着找副业？",
        "answer": "我妈可以劳动的时间越来越短了，未来的养老只有靠我。所以希望今年就能有副业收入，开始一个月三百就行。",
        "critical": false,
        "info": "动机是养老焦虑驱动，不是兴趣或职业发展"
      },
      {
        "id": "q_expect",
        "text": "一个月六千这个目标怎么来的？",
        "answer": "现阶段能有个三五百就很开心了。六千是因为我现在每个月到手就是六千，至于怎么实现，我一点头绪都没有，算是……一个幻想吧。",
        "critical": false,
        "info": "期望值其实很谦虚，三百块就能满足"
      },
      {
        "id": "q_rule",
        "text": "事业编对做副业有纪律限制吗？",
        "answer": "事业编嘛，不可能去做生意，不可能家里面做生意。帮衬是可以的，但那不属于我的收入。",
        "critical": false,
        "info": "先排除掉辞职经商和名下经营两类选项"
      },
      {
        "id": "q_daily",
        "text": "平时一天是怎么过的？说说流水账。",
        "answer": "挺宅的，自我满足能力比较强，除了吃喝没什么爱好。工作看着闲，但街道重点工作随时会打断你，一年平均下来每天也就三四个小时真正空闲。",
        "critical": false,
        "info": "时间碎片化，随时待命是隐性的失控感来源"
      },
      {
        "id": "q_skill",
        "text": "你有什么擅长的？或者兴趣所在？",
        "answer": "爱吃，性格宅，不抽烟不喝酒不氪金。文字水平写个材料都得靠 AI。电脑……word 和 excel 会用，但群里说的那些概念，我一个都听不懂，那些字母都得查。",
        "critical": false,
        "info": "内容创作类副业缺乏个人抓手，认知断层明显"
      }
    ]
  },
  "advice": {
    "chances": 2,
    "options": [
      {
        "id": "a_best",
        "text": "副业先放一放。你现在最先做的不是找项目，是把身体从 93 公斤减下来、把掌控感找回来——从每天能完成的最小动作开始，比如不坐电梯改爬楼、没人的时候做几个俯卧撑。减肥这件事只依赖你自己，是重建启动能力的第一个闭环。",
        "type": "best",
        "reaction": "（沉默了一会儿）可能我真正的问题，就是这种心理或者认知得调整……我跟外形和解这个事，被你们这么一说，好像是有点自欺。行，这个我接。",
        "why_correct": "三个关键信息在此汇合：存款三万意味着不能有试错成本——而减肥零成本；从未启动过任何事——所以要先有完成一件事的体验；与外形和解是自欺——身体是被他亲手忽视的核心资产。方向、时机、能力三个维度同时对上。"
      },
      {
        "id": "a_media",
        "text": "做自媒体吧！你时间多，拍视频记录减肥过程，一边减一边起号，接广告带货。你们那儿做本地探店，一条视频报价一千多，一个月十几条，六千块稳稳的。",
        "type": "reject",
        "reaction": "起号那个，我老有种在空中飘着的感觉。你说让我利用互联网挣钱，确实是在让我挣认知之外的钱……你就说让我自媒体起号，我就觉得你在跟我开玩笑。再说我事业编，确实不好露脸。",
        "why_wrong": "撞上认知壁垒、从未启动、不便露脸三重墙。问过他尝试过什么的话，会知道这是他当晚拒绝过三次的方向——他把方法递到手边，不等于把动力也递过去。"
      },
      {
        "id": "a_local",
        "text": "在你那个城市做个小生意吧，摆摊卖卤味，或者帮特产店带货抽成，成本低、时间灵活，饿不死。",
        "type": "avoid",
        "reaction": "这个嘛……我妈折腾了十年小生意，休闲吧、餐饮、电话亭，最后全赔了，钱全是她出的。要本钱的事，我现在真不敢想——存款就三万，得留着应急。而且我 30 了，体力型的活儿也干不长……你们再帮我看看别的？",
        "why_wrong": "母亲十年创业全赔的阴影、存款三万没有本钱、他明确要非体力型——三条信息任何一条问到位，这个建议在出口前就该被划掉。当事人的回避不是没听懂，是不想接。"
      },
      {
        "id": "a_cert",
        "text": "你的优势是会考试。全力备考法考——A 证一次性奖励一万块；再把备考资料和经验做成模板课挂到网上卖，像那个美术老师一样，一份成本卖 N 次。",
        "type": "hesitate",
        "reaction": "（语气松动了一点）美术老师那个……我感觉好像可以有点启发，好像可以干点类似的。不过法考我真的畏难，身边失败的例子太多，就……先放一放吧。（此后再无下文）",
        "why_wrong": "全场唯一让他松动过的方向，所以最迷惑。但松动不等于行动——法考想了多年只有想法，模板课有点启发之后再无下文。缺的仍然是启动能力，方向换了照样卡住。这条最能检验你看没看穿认知才是主线。"
      }
    ]
  },
  "reveal": {
    "steps": [
      {
        "title": "第一步：识别假问题",
        "body": "找一个什么副业是假问题。真问题是：一个从没启动过任何事的人，正在用选副业这个动作，回避我什么都启动不了的恐惧。他自己其实已经摸到了边——可能我真正的问题，就是这种心理或认知得调整。"
      },
      {
        "title": "第二步：看穿求助闭环",
        "body": "注意这个结构：方法递到手边，他说我不懂、我畏难、开玩笑——任何方法都会撞上缺乏动力这堵墙，然后被解释成此路不通。闭环就此形成：我求助过、方法都试不了、我已经尽力了，于是心安理得地和解。加引号的和解。"
      },
      {
        "title": "第三步：翻译与外形和解",
        "body": "93 公斤、纯节食、零运动，然后说早就和解了——如果这是一个 20 年后才结算的良性肿瘤，说跟它和解了，可不可笑？为什么换成肥胖就和解了呢？和解在这里不是豁达，是提前给放弃盖了章。"

let CFG = null;
let STATE = null;

function newState(){
  return {
    scene: 0,            // 0 背景 1 提问 2 建议 3 答案
    remainingPool: [],   // 剩余未问的问题（没选中的会放回，继续出现）
    currentPair: [],     // 本轮展示的两个问题
    totalRounds: 0,      // 总轮数
    roundIdx: 0,
    pickedQ: [],          // 已问的问题对象
    roundResolved: false, // 本轮已选
    adviceChancesUsed: 0,
    advicePicked: null,   // 选中的建议对象
    adviceOutcome: null,  // win / lose
    revealIdx: 0,
    retried: false
  };
}

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; }
  return a;
}

/* 轮数规则：问题越多轮数越多，保证读者拿到足够线索（问题数-轮数≈漏掉数） */
function deriveRounds(poolLen){
  if(poolLen <= 6) return 4;   // 5-6 题 → 4 轮
  if(poolLen <= 8) return 6;   // 7-8 题 → 6 轮
  return 7;                     // 9-10 题 → 7 轮
}

/* 每轮从剩余池抽 2 个展示（优先 1 关键 + 1 非关键，抽展示不动池子）；没被选中的会留在池子里，后面继续出现 */
function drawPair(){
  const pool = STATE.remainingPool;
  const crit = pool.filter(q=>q.critical);
  const norm = pool.filter(q=>!q.critical);
  const pair = [];
  if(crit.length) pair.push(crit[Math.floor(Math.random()*crit.length)]);
  if(norm.length) pair.push(norm[Math.floor(Math.random()*norm.length)]);
  while(pair.length < 2 && pair.length < pool.length){
    const rest = pool.filter(q=>!pair.includes(q));
    if(!rest.length) break;
    pair.push(rest[Math.floor(Math.random()*rest.length)]);
  }
  return shuffle(pair);
}

function escapeHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render(){
  renderProgress();
  let html = '';
  if(STATE.scene===0) html = renderScene0();
  else if(STATE.scene===1) html = renderScene1();
  else if(STATE.scene===2) html = renderScene2();
  else html = renderScene3();
  document.getElementById('stage-container').innerHTML = html;
  renderActions();
}

function renderProgress(){
  const bar = document.getElementById('progress-bar');
  const fill = document.getElementById('progress-fill');
  if(STATE.scene===0){ bar.style.display='none'; return; }
  bar.style.display='block';
  const pct = STATE.scene/3*100;
  fill.style.width = pct + '%';
}

function renderHeader(){
  const h = document.getElementById('case-header');
  h.innerHTML = `
    <div class="hero">
      <div class="case-tag">咨询室</div>
      <h1>${escapeHtml(CFG.title)}</h1>
      <div class="subtitle">${escapeHtml(CFG.subtitle)}</div>
    </div>
  `;
}

/* ---------- 场景 0：背景 ---------- */
function renderScene0(){
  const b = CFG.background;
  return `
    <div class="stage-card">
      <div class="stage-label">当 事 人 求 助</div>
      <div class="scene-label" style="font-size:13px;color:var(--text-secondary);margin-bottom:8px">📍 ${escapeHtml(b.scene_label)}</div>
      <div class="question-box">${escapeHtml(b.question_text)}</div>
      <div class="hint-card">💭 ${escapeHtml(b.hint_card)}</div>
    </div>
  `;
}

/* ---------- 场景 1：提问循环 ---------- */
function renderScene1(){
  const idx = STATE.roundIdx;
  const pair = STATE.currentPair;
  if(idx >= STATE.totalRounds){
    return `<div class="stage-card"><div class="stage-subtitle">提问结束。</div></div>`;
  }
  const roundHtml = pair.map((item,i)=>{
    const picked = STATE.roundResolved && STATE.pickedQ.length && STATE.pickedQ[STATE.pickedQ.length-1].id===item.id;
    const cls = picked ? 'q-card picked' : 'q-card';
    const tag = picked ? '✓ 你问了' : '提问选项 ' + String.fromCharCode(65+i);
    const handler = STATE.roundResolved ? '' : `onclick="pickQuestion('${item.id}')"`;
    return `<div class="${cls}" ${handler}>
      <div class="q-tag">${tag}</div>
      <div class="q-text">${escapeHtml(item.text)}</div>
    </div>`;
  }).join('');

  let dialogHtml = '';
  if(STATE.roundResolved){
    const last = STATE.pickedQ[STATE.pickedQ.length-1];
    dialogHtml = `
      <div class="dialog">
        <div class="bubble me">${escapeHtml(last.text)}</div>
        <div class="bubble them"><div class="who">当事人</div>${escapeHtml(last.answer)}</div>
      </div>`;
  }

  const pipHtml = Array.from({length: STATE.totalRounds}).map((_,i)=>`<span class="pip ${i<idx+ (STATE.roundResolved?1:0)?'used':''}"></span>`).join('');

  return `
    <div class="stage-card">
      <div class="stage-label">提 问 环 节</div>
      <div class="stage-title">每一轮可以选一个问</div>
      <div class="round-meta">
        <span>第 <span class="round-idx">${idx+1}</span> / ${STATE.totalRounds} 轮</span>
        <span class="ask-budget">${pipHtml}</span>
      </div>
      <div class="stage-subtitle">选择你最想知道的信息提问，他回答你之后进入下一轮提问。</div>
      <div class="q-pair">${roundHtml}</div>
      ${dialogHtml}
    </div>
  `;
}

function pickQuestion(id){
  if(STATE.roundResolved) return;
  const picked = STATE.currentPair.find(q=>q.id===id);
  if(!picked) return;
  STATE.remainingPool = STATE.remainingPool.filter(q=>q.id!==id); // 选中的移出池子；没选的留在池子里，后面还会出现
  STATE.pickedQ.push(picked);
  STATE.roundResolved = true;
  render();
}

function nextRound(){
  STATE.roundIdx++;
  STATE.roundResolved = false;
  if(STATE.roundIdx >= STATE.totalRounds){
    STATE.scene = 2;
  } else {
    STATE.currentPair = drawPair();
  }
  render();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

/* ---------- 场景 2：建议 ---------- */
function renderScene2(){
  const adv = CFG.advice;
  const chances = adv.chances;
  const used = STATE.adviceChancesUsed;

  let panelHtml = '';
  const askedIds = STATE.pickedQ.map(q=>q.id);
  const rows = CFG.questions.pool.map(q=>{
    const got = askedIds.includes(q.id);
    return `<div class="info-row ${got?'got':'miss'}">
      <span class="dot"></span>
      <span class="txt">${got ? escapeHtml(q.info) : '（未获得——你没问到这条信息）'}</span>
    </div>`;
  });
  panelHtml = `
    <div class="info-panel">
      <div class="ip-title">你手里的信息（问到的 / 错过的）</div>
      ${rows.join('')}
    </div>`;

  let cardsHtml = '';
  if(!STATE.adviceOutcome){
    cardsHtml = adv.options.map(o=>{
      const dead = STATE.adviceDeadIds && STATE.adviceDeadIds.includes(o.id);
      const cls = dead ? 'adv-card dimmed' : 'adv-card';
      return `<div class="${cls}" ${dead?'':`onclick="pickAdvice('${o.id}')"`}>
        <div class="adv-text">${escapeHtml(o.text)}</div>
      </div>`;
    }).join('');
  }

  let dialogHtml = '';
  let feedbackHtml = '';
  if(STATE.advicePicked && STATE.adviceOutcome!=='win'){
    const o = STATE.advicePicked;
    const styleMap = { reject:'feedback-bad', avoid:'feedback-warn', hesitate:'feedback-warn' };
    dialogHtml = `
      <div class="dialog">
        <div class="bubble me">${escapeHtml(o.text)}</div>
        <div class="bubble them"><div class="who">当事人</div>${escapeHtml(o.reaction)}</div>
      </div>`;
    const left = chances - used;
    feedbackHtml = left > 0
      ? `<div class="feedback ${styleMap[o.type]||'feedback-warn'}"><strong>这个方向，当事人没有接受。</strong> 你还有 ${left} 次机会——换一个建议试试。</div>`
      : `<div class="feedback ${styleMap[o.type]||'feedback-bad'}"><strong>两次建议都没能帮到他。</strong> 机会用完了。你可以重来一次，或者直接看咨询师是怎么拆解这个案子的。</div>`;
  } else if(STATE.adviceOutcome==='win'){
    const o = STATE.advicePicked;
    dialogHtml = `
      <div class="dialog">
        <div class="bubble me">${escapeHtml(o.text)}</div>
        <div class="bubble them"><div class="who">当事人</div>${escapeHtml(o.reaction)}</div>
      </div>`;
    feedbackHtml = `<div class="feedback feedback-good"><strong>你给出了最适合他的方向。</strong> 不是让他辞、也不是劝他忍——用最小代价验证。看完整拆解：</div>`;
  }

  return `
    <div class="stage-card">
      <div class="stage-label">给 出 建 议</div>
      <div class="stage-title">基于你问到的信息，给他一个建议</div>
      <div class="stage-subtitle">四个方向只有一个是最合适的。你有 ${chances} 次机会，选错会看到当事人的真实反应。</div>
      ${panelHtml}
      ${cardsHtml}
      ${dialogHtml}
      ${feedbackHtml}
    </div>
  `;
}

function pickAdvice(id){
  if(STATE.adviceOutcome==='win') return;
  const o = CFG.advice.options.find(x=>x.id===id);
  STATE.advicePicked = o;
  STATE.adviceDeadIds = STATE.adviceDeadIds || [];
  STATE.adviceDeadIds.push(id);
  STATE.adviceChancesUsed++;
  if(o.type==='best'){
    STATE.adviceOutcome = 'win';
  } else if(STATE.adviceChancesUsed >= CFG.advice.chances){
    STATE.adviceOutcome = 'lose';
  }
  render();
  window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
}

function retryAdvice(){
  STATE.adviceChancesUsed = 0;
  STATE.advicePicked = null;
  STATE.adviceOutcome = null;
  STATE.adviceDeadIds = [];
  STATE.retried = true;
  render();
}

function goReveal(){
  STATE.scene = 3;
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- 场景 3：答案（拆解展开 + 复盘） ---------- */
function renderScene3(){
  const r = CFG.reveal;
  const total = r.steps.length;
  const allShown = STATE.revealIdx >= total - 1;
  const stepsHtml = r.steps.map((step,i)=>{
    const show = i <= STATE.revealIdx;
    return `<div class="step ${show?'show':''}">
      <div class="step-title">${escapeHtml(step.title)}</div>
      <div class="step-body">${escapeHtml(step.body)}</div>
    </div>`;
  }).join('');

  const hint = allShown
    ? `<div class="tap-hint done">✓ 拆解完毕</div>`
    : `<div class="tap-hint">👆 点击屏幕任意位置，继续展开（${STATE.revealIdx+1}/${total}）</div>`;

  const conclHtml = allShown ? `
    <div class="stage-card">
      <div class="stage-label">结 论 复 盘</div>
      <div class="stage-title">${escapeHtml(r.conclusion.title)}</div>
      <ul style="padding-left:20px;margin-top:12px">
        ${r.conclusion.items.map(t=>`<li style="margin-bottom:10px;font-size:14px;line-height:1.8">${escapeHtml(t)}</li>`).join('')}
      </ul>
      <div style="margin:18px 0 4px;font-size:13px;font-weight:700;color:var(--text-muted)">金句时刻</div>
      ${r.quotes.map(q=>`<div class="quote-card"><div class="quote-text">${escapeHtml(q.text)}</div></div>`).join('')}
    </div>
    ${renderReport()}
    <div class="funnel-card">
      <div class="funnel-title">${escapeHtml(r.funnel.title)}</div>
      <div class="funnel-subtitle">${escapeHtml(r.funnel.subtitle)}</div>
      <div class="funnel-qr"><img src="${escapeHtml(r.funnel.qrcode)}" alt="二维码"></div>
      <div class="funnel-tag">长按或扫码加入</div>
    </div>
    <div style="margin-top:16px;text-align:center">
      <a href="index.html" style="color:var(--primary);text-decoration:none;font-size:13px;font-weight:600">返回咨询室主页 →</a>
    </div>
  ` : '';

  return `
    <div class="stage-card">
      <div class="stage-label">咨 询 师 的 拆 解</div>
      <div class="stage-title">如果是我，会这么拆</div>
      <div class="stage-subtitle">点击屏幕逐步展开</div>
      ${hint}
      <div>${stepsHtml}</div>
    </div>
    ${conclHtml}
  `;
}

function nextRevealStep(){
  const total = CFG.reveal.steps.length;
  if(STATE.revealIdx < total - 1){
    STATE.revealIdx++;
    render();
  }
}

document.addEventListener('click',(e)=>{
  if(STATE && STATE.scene===3){
    if(e.target.closest('button') || e.target.closest('a')) return;
    nextRevealStep();
  }
});

function buildReport(){
  const asked = STATE.pickedQ.map(q=>q.text);
  const missedCritical = STATE.remainingPool.filter(q=>q.critical);
  const outcomeMap = { win:'给出最适合方向', lose:'两次建议未中', null:'—' };
  return `【咨询室 · ${CFG.title.replace('咨询室 · ','')}】
${CFG.subtitle}

提问环节（${asked.length}/${STATE.totalRounds} 轮）
${asked.map((t,i)=>`  ${i+1}. ${t}`).join('\n')}
  漏掉的关键信息：${missedCritical.length ? missedCritical.map(q=>q.text).join('；') : '无——关键信息全部问到'}

建议环节
  结局：${outcomeMap[STATE.adviceOutcome]}
  ${STATE.retried?'（重试过一次）':''}

— 咨询完成 · 生成于 ${new Date().toLocaleDateString('zh-CN')}`;
}

function renderReport(){
  return `
    <div class="report-box">
      <div style="font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px">我的咨询报告</div>
      <div class="report-content" id="report-content">${escapeHtml(buildReport())}</div>
      <div class="btn-row" style="margin-top:12px">
        <span></span>
        <button class="btn btn-ghost" onclick="copyReport()">复制报告</button>
      </div>
      <span class="copy-ok" id="copy-ok">✓ 已复制到剪贴板</span>
    </div>
  `;
}

function copyReport(){
  const text = buildReport();
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(showCopyOk).catch(fallbackCopy);
  } else fallbackCopy();
}
function fallbackCopy(){
  const ta = document.createElement('textarea');
  ta.value = buildReport();
  document.body.appendChild(ta);
  ta.select();
  try{ document.execCommand('copy'); showCopyOk(); }catch(e){}
  document.body.removeChild(ta);
}
function showCopyOk(){
  const el = document.getElementById('copy-ok');
  if(el) el.classList.add('show');
  setTimeout(()=>{ if(el) el.classList.remove('show'); }, 2000);
}

/* ---------- 动作按钮 ---------- */
function renderActions(){
  const row = document.getElementById('action-row');
  let html = '';
  if(STATE.scene===0){
    html = `<span></span><button class="btn btn-primary" onclick="startConsult()">开始提问 →</button>`;
  } else if(STATE.scene===1){
    if(STATE.roundResolved){
      const isLast = STATE.roundIdx >= STATE.totalRounds-1;
      html = `<span></span><button class="btn btn-primary" onclick="nextRound()">${isLast?'进入建议环节 →':'下一轮 →'}</button>`;
    } else {
      html = `<span></span><button class="btn btn-primary" disabled>选完可继续下一问</button>`;
    }
  } else if(STATE.scene===2){
    if(STATE.adviceOutcome==='win'){
      html = `<span></span><button class="btn btn-primary" onclick="goReveal()">看完整拆解 →</button>`;
    } else if(STATE.adviceOutcome==='lose'){
      html = `<button class="btn btn-ghost" onclick="retryAdvice()">↺ 重来一次建议</button><button class="btn btn-primary" onclick="goReveal()">直接看答案 →</button>`;
    } else {
      html = `<span></span><button class="btn btn-primary" disabled>选一个建议</button>`;
    }
  }
  row.innerHTML = html;
}

function startConsult(){
  STATE.scene = 1;
  STATE.remainingPool = shuffle(CFG.questions.pool);
  STATE.totalRounds = CFG.questions.rounds || deriveRounds(CFG.questions.pool.length);
  STATE.currentPair = drawPair();
  render();
}

function restart(){
  STATE = newState();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

(async function init(){
  let cfg = FALLBACK_CONFIG;
  try{
    const res = await fetch('case-001a.json');
    if(res.ok) cfg = await res.json();
  }catch(e){}
  CFG = cfg;
  STATE = newState();
  renderHeader();
  render();
})();
</script>
